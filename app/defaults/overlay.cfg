# OverLyder configuration
# Long press threshold (ms) and keys that must be held together.
# Key names: home, menu, select, start, a, b, x, y, l1, r1 (or Linux key codes)
hold_ms=700
trigger=316
dim=55
step=5
confirm_exit=1
# 1 = draw on a hardware display layer and leave the game running (no SIGSTOP).
# Falls back to freezing the game automatically if no layer is available.
no_sigstop=1
# Keyboard: 1 = full keyboard with input box, 2 = compact (writes directly to the app)
keyboard_mode=2
# Key codes held together to open the keyboard directly (empty = disabled).
# L2/LT = 1001, R2/RT = 1002 (analog ABS_Z/ABS_RZ pressed past 128).
kbd_trigger=314,310
# UI language: es (Spanish), en (English), pt (Portuguese)
lang=es
# Static LED color in RRGGBB (optional). Set from the overlay's LED color row.
# When set, it overrides CrossMix LED effects and is restored at boot.
# ledcolor=FF0000
