# OverLyder configuration
# Long press threshold (ms) and keys that must be held together.
# Key names: home, menu, select, start, a, b, x, y, l1, r1 (or Linux key codes)
hold_ms=700
trigger=316
dim=55
step=5
confirm_exit=1
# 1 = draw on a hardware display layer and leave the game running (no SIGSTOP).
# Falls back to freezing the game automatically if no layer is available.
no_sigstop=1
# Keyboard: 1 = full keyboard with input box, 2 = compact (writes directly to the app)
keyboard_mode=2
# Persistent read-only FPS/performance HUD (rendered on a second display layer).
# fps_hud: 0 = off, 1 = on.
# fps_hud_pos: 0 = top-left, 1 = top-right, 2 = bottom-left, 3 = bottom-right.
# fps_hud_style: 0 = simple (one line of text, no window), 1 = window/box.
# fps_hud_fields: bit mask of rows (1 FPS, 2 frametime, 4 CPU, 8 GPU,
# 16 temperature, 32 CPU freq, 64 GPU freq, 128 battery).
fps_hud=0
fps_hud_pos=0
fps_hud_style=0
fps_hud_fields=31
# Experimental FPS limiter. Enable it from the OverLyder app first: with
# fps_limit_enabled=0 the limiter row is hidden in the in-game overlay.
fps_limit_enabled=0
# Target frame rate when enabled: 0 = no cap, else 5..60 in steps of 5.
# Implemented as an LD_PRELOAD shim registered by install.sh; it never changes
# clocks or game files.
fps_limit=0
# Key codes held together to open the keyboard directly (empty = disabled).
# L2/LT = 1001, R2/RT = 1002 (analog ABS_Z/ABS_RZ pressed past 128).
kbd_trigger=314,310
# UI language: es (Spanish), en (English), pt (Portuguese)
lang=es
# Static LED color in RRGGBB (optional). Set from the overlay's LED color row.
# When set, it overrides CrossMix LED effects and is restored at boot.
# ledcolor=FF0000
